name: Build and test releases
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix electron
      - run: npm test --prefix electron
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: ./build-release.ps1
        shell: pwsh
      - run: python -m PyInstaller --noconfirm --onefile --name Omni-Backend --distpath dist --workpath build/electron-backend --specpath build native_bridge.py
      - run: npm run dist --prefix electron -- --win nsis portable
      - name: Assemble Omni desktop release assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem electron/dist -Filter '* Setup *.exe' | Select-Object -First 1
          $portable = Get-ChildItem electron/dist -Filter 'Omni *.exe' | Where-Object Name -NotLike '*Setup*' | Select-Object -First 1
          if (-not $installer -or -not $portable) { throw 'Electron installer or portable build is missing' }
          Copy-Item $installer.FullName dist/Omni-Setup.exe -Force
          Copy-Item $portable.FullName dist/Omni-Portable.exe -Force
          $assets = Get-ChildItem dist -File | Where-Object Extension -In @('.exe', '.zip', '.gz') | Sort-Object Name
          $lines = foreach ($asset in $assets) { $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $($asset.Name)" }
          [IO.File]::WriteAllLines((Join-Path (Resolve-Path dist) 'SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))
      - run: python tests/portable_smoke.py dist/GeminiAccounts-CLI.exe
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiAccounts-Windows-x64
          path: dist/*
  terminal:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            archive: macos-arm64
          - runner: macos-15-intel
            archive: macos-x64
          - runner: ubuntu-latest
            archive: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cli.txt pyinstaller
      - run: python -m unittest tests.test_console tests.test_accounts tests.test_activity tests.test_quota_queue tests.test_response_guard tests.test_provider_errors tests.test_gateway_diagnostics tests.test_updater tests.test_native_reasoning tests.test_quota_starts tests.test_routing tests.test_model_selection tests.test_quota_limits tests.test_claude_auth tests.test_api_accounts tests.test_quota_guard tests.test_token_capacity
      - run: python -m PyInstaller --noconfirm --onefile --name gemini-accounts --add-data assets/cliproxy-models.json:assets --collect-all tzdata console.py
      - run: python tests/portable_smoke.py dist/gemini-accounts
      - run: tar -czf dist/GeminiAccounts-CLI-${{ matrix.archive }}.tar.gz -C dist gemini-accounts -C .. CLI.md LICENSE THIRD_PARTY.md
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiAccounts-CLI-${{ matrix.archive }}
          path: dist/*.tar.gz
