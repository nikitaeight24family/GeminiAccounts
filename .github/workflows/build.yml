name: Build and test releases
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: ./build-release.ps1
        shell: pwsh
      - run: python tests/portable_smoke.py dist/GeminiAccounts-CLI.exe
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiAccounts-Windows-x64
          path: dist/*
  terminal:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            archive: macos-arm64
          - runner: macos-15-intel
            archive: macos-x64
          - runner: ubuntu-latest
            archive: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cli.txt pyinstaller
      - run: python -m unittest tests.test_console tests.test_accounts tests.test_activity tests.test_quota_queue tests.test_quota_starts tests.test_routing
      - run: python -m PyInstaller --noconfirm --onefile --name gemini-accounts --collect-all tzdata console.py
      - run: python tests/portable_smoke.py dist/gemini-accounts
      - run: tar -czf dist/GeminiAccounts-CLI-${{ matrix.archive }}.tar.gz -C dist gemini-accounts -C .. CLI.md LICENSE THIRD_PARTY.md
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiAccounts-CLI-${{ matrix.archive }}
          path: dist/*.tar.gz
